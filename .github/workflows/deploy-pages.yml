
name: Deploy FoodWise to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'
      - '.github/workflows/deploy-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy FoodWise
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check frontend entry
        run: |
          test -f front/index.html
          echo "FoodWise frontend found."

      - name: Upload FoodWise frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./front

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
