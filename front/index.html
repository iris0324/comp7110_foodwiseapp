<!-- Persistent file inputs are deliberately OUTSIDE #app. When iOS opens its
     native camera, FoodWise may re-render on focus: re-rendering must never
     destroy the input whose change event carries the photograph. -->
<input id="receipt-camera" class="persistent-photo-input" type="file" accept="image/*" capture="environment" aria-label="Take receipt photo" tabindex="-1">
<input id="receipt-image" class="persistent-photo-input" type="file" accept="image/*" aria-label="Choose receipt photo from album" tabindex="-1">
<input id="product-camera" class="persistent-photo-input" type="file" accept="image/*" capture="environment" aria-label="Take product photo" tabindex="-1">
<input id="product-image" class="persistent-photo-input" type="file" accept="image/*" aria-label="Choose product photo from album" tabindex="-1">
