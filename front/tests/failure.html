<!doctype html><html lang="en"><meta charset="utf-8"><title>FoodWise isolated UI failure injection</title><style>body{font:14px system-ui;margin:20px}button{padding:12px}iframe{width:390px;height:844px;display:block;margin-top:15px}pre{white-space:pre-wrap}</style><h1>UI save failure verification</h1><p>Only this test frame is instrumented. Normal product pages have no fault control. Saves still use the real IndexedDB transaction.</p><button id="fail">Fail the next transaction write in this frame</button><button id="generation">Fail the next receipt generation in this frame</button><pre id="report">No injection</pre><iframe id="product" title="FoodWise failure test" src="../#cart"></iframe><script>
const storyId=new URLSearchParams(location.search).get('story');if(storyId)document.querySelector('#product').src='../#story/'+encodeURIComponent(storyId);document.querySelector('#generation').onclick=async()=>{const win=document.querySelector('#product').contentWindow;const module=await win.Function('return import("'+win.location.origin+'/js/domain/receipt.js?v=6.2")')();const original=module.receiptServices.generate;module.receiptServices.generate=async()=>{module.receiptServices.generate=original;throw new win.Error('generationError');};document.querySelector('#report').textContent='Generation armed';};if(new URLSearchParams(location.search).has('receipt'))document.querySelector('#product').src='../#receipt';let attempts=[];document.querySelector('#fail').onclick=()=>{const win=document.querySelector('#product').contentWindow;const original=win.IDBObjectStore.prototype.put;let first=true;win.IDBObjectStore.prototype.put=function(value,...args){if(this.name==='app'&&value.appliedOperations){const keys=Object.keys(value.appliedOperations);attempts.push({revision:value.revision,operationId:keys.at(-1),firstFailure:first});document.querySelector('#report').textContent=JSON.stringify(attempts,null,2);if(first){first=false;throw new win.Error('saveError');}win.IDBObjectStore.prototype.put=original;}return original.call(this,value,...args);};document.querySelector('#report').textContent='Armed';};
</script></html>
